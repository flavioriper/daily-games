name: android

# Push to main builds the APK and drops it in App Tester. Nothing else deploys
# from this repo. The same build can be run by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7"
  APP_ID: "1:260608109943:android:cc54665867638bf150c572"
  TESTERS: "flavioriper@gmail.com"

jobs:
  build:
    runs-on: ubuntu-latest
    # id-token lets the run prove who it is to Google (Workload Identity
    # Federation), so App Distribution needs no stored key. The organisation
    # the Firebase project sits in forbids service-account keys outright.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # The engine and the Android templates are ~450 MB together and change
      # only with the engine version, so the first run pays for them and the
      # rest do not.
      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-stable-android

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          curl -sSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot/godot
          chmod +x ~/godot/godot
          # Only the Android templates; the full pack is 1.2 GB.
          curl -sSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j -o /tmp/templates.tpz 'templates/android_*' \
            -d "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - name: Put Godot on PATH
        run: echo "$HOME/godot" >> "$GITHUB_PATH"

      # The export runs Gradle (the Android build template), which Play's AAB,
      # the ads plugin and billing all need. Its dependencies are the slow part
      # of a cold run, so they are cached like the engine.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      # The debug keystore has to be the one this project always signs with:
      # Android refuses to install a build signed by a different key over the
      # copy already on the phone.
      - name: Restore the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_DEBUG_KEYSTORE secret is missing"
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$HOME/debug.keystore"

      - name: Restore the analytics secret
        env:
          API_SECRET: ${{ secrets.ANALYTICS_API_SECRET }}
        run: |
          if [ -n "$API_SECRET" ]; then
            printf '[analytics]\napi_secret="%s"\n' "$API_SECRET" > analytics_secret.cfg
          else
            echo "::warning::no ANALYTICS_API_SECRET; this build reports nothing"
          fi

      # Importing also makes Godot write its editor settings, so the SDK and
      # keystore lines below go into a file the engine itself generated rather
      # than one hand-rolled here.
      - name: Import resources
        run: godot --headless --path . --import

      - name: Point Godot at the SDK and the key
        run: |
          set -euo pipefail
          settings="$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres"
          test -f "$settings"
          cat >> "$settings" <<EOF
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Tests
        run: |
          set -o pipefail
          godot --headless --path . --script tests/run_tests.gd | tee /tmp/tests.log
          # The runner reports its own tally; a non-zero failure count stops
          # the build here, before anything reaches a phone.
          grep -q "failed=0" /tmp/tests.log

      # Every build gets its own version code, so App Distribution and the
      # phone can tell two of them apart.
      - name: Stamp the build
        run: |
          set -euo pipefail
          sed -i "s|^version/code=.*|version/code=${GITHUB_RUN_NUMBER}|" export_presets.cfg
          sed -i "s|^version/name=.*|version/name=\"0.1.${GITHUB_RUN_NUMBER}\"|" export_presets.cfg
          tools/strip_dev_addons.sh

      - name: Export the APK
        run: |
          set -euo pipefail
          mkdir -p build/android
          # --install-android-build-template unpacks android/build from the
          # engine's android_source.zip; android/ is not in git.
          godot --headless --path . --install-android-build-template \
            --export-debug Android build/android/peeplet-daily.apk
          test -s build/android/peeplet-daily.apk

      # Keyless: the run's own GitHub token is exchanged for the App
      # Distribution service account through the `github` identity pool in
      # the Firebase project; tools/ci_identity.sh is the one-time setup.
      # The step fails loudly if the exchange does; there is no secret whose
      # absence could make "nothing distributed" a warning any more.
      - name: Sign in to Google
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/260608109943/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: app-distribution@daily-games-420bf.iam.gserviceaccount.com

      - name: Distribute to testers
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15 appdistribution:distribute \
            build/android/peeplet-daily.apk \
            --app "$APP_ID" \
            --project daily-games-420bf \
            --release-notes "$(git log -1 --pretty='%h %s')" \
            --testers "$TESTERS"

      # A copy to download by hand. The account-wide artifact quota is not this
      # repo's problem to fail over, so a rejection here is only a note.
      - name: Keep a copy on the run
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: peeplet-daily-apk
          path: build/android/peeplet-daily.apk
          retention-days: 14
