<!doctype html>
<!-- The quality dashboard's source. tools/build_dashboard.py inlines
     tools/days/*.json where DATA stands and writes tools/dashboard.html.
     docs/superpowers/specs/2026-10-13-day-documents-dashboard-design.md -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily days</title>
<style>
:root {
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --hair: #e1e0d9; --axis: #c3c2b7; --wall: #3a3936; --cell: #ffffff; --accent: #2a78d6;
  --accent-soft: #cde2fb; --bar: #86b6ef; --bar-on: #1c5cab;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --s0: #2a78d6; --s1: #eb6834; --s2: #1baf7a; --s3: #eda100; --s4: #e87ba4; --s5: #008300;
  --s6: #6250d6; --s7: #e34948; --s8: #86b6ef; --s9: #f3a585; --s10: #76cfaf; --s11: #f4c766;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
    --hair: #2c2c2a; --axis: #383835; --wall: #5c5b56; --cell: #232322; --accent: #3987e5;
    --accent-soft: #10305c; --bar: #256abf; --bar-on: #9ec5f4;
    --s0: #3987e5; --s1: #d95926; --s2: #199e70; --s3: #c98500; --s4: #d55181; --s5: #008300;
    --s6: #9085e9; --s7: #e66767; --s8: #184f95; --s9: #8a3c1c; --s10: #0f6b4b; --s11: #7d5400;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  display: grid; grid-template-columns: 232px 1fr; }
h1, h2, .round { font-family: ui-rounded, "SF Pro Rounded", "Fredoka", system-ui, sans-serif; }
nav { border-right: 1px solid var(--hair); overflow-y: auto; height: 100vh; position: sticky; top: 0;
  padding: 18px 10px 24px; }
nav h1 { font-size: 17px; margin: 0 8px 2px; letter-spacing: -.01em; }
nav .sub { color: var(--muted); font-size: 12px; margin: 0 8px 14px; }
nav button { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none;
  color: var(--ink2); font: inherit; text-align: left; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
nav button:hover { background: var(--hair); }
nav button[aria-current="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
nav .n { margin-left: auto; font-size: 11px; font-variant-numeric: tabular-nums; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: transparent; }
.dot.warning { background: var(--warning); } .dot.critical { background: var(--critical); }
.dot.serious { background: var(--serious); }
main { padding: 20px 28px 48px; min-width: 0; max-width: 1280px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 18px; margin-bottom: 18px; }
header h2 { font-size: 26px; margin: 0; letter-spacing: -.02em; }
.seg { display: inline-flex; background: var(--hair); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; color: var(--ink2); font: inherit; padding: 5px 12px;
  border-radius: 8px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600;
  box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.day { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; }
.day button { border: 1px solid var(--hair); background: var(--surface); color: var(--ink); width: 30px;
  height: 30px; border-radius: 8px; cursor: pointer; font-size: 15px; }
.day button:disabled { opacity: .35; cursor: default; }
.day b { font-variant-numeric: tabular-nums; min-width: 132px; text-align: center; }
.flags { display: flex; flex-wrap: wrap; gap: 6px; margin: -6px 0 14px; min-height: 0; }
.flag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink2);
  border: 1px solid var(--hair); background: var(--surface); padding: 3px 9px; border-radius: 999px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--hair); border-radius: 14px; padding: 14px 16px 16px;
  min-width: 0; }
.panel h3 { margin: 0 0 10px; font-size: 12px; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: .06em; }
.panel svg { display: block; width: 100%; height: auto; max-height: 62vh; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 10px; font-size: 12px; color: var(--ink2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; margin: 16px 0; }
.tile { background: var(--surface); border: 1px solid var(--hair); border-radius: 12px; padding: 9px 12px;
  cursor: pointer; text-align: left; font: inherit; color: inherit; }
.tile[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.tile .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile .m { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tile.plain { cursor: default; }
#still { color: var(--muted); font-size: 12px; margin: -6px 2px 16px; }
.strip h3 { display: flex; gap: 8px; align-items: baseline; }
.strip h3 span { text-transform: none; letter-spacing: 0; font-weight: 400; }
.strip svg { max-height: none; }
.strip rect.hit { fill: transparent; cursor: pointer; }
#tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--page); font-size: 12px;
  padding: 5px 8px; border-radius: 6px; opacity: 0; transition: opacity .08s; z-index: 5; white-space: pre; }
.tree { font-size: 13px; overflow-x: auto; }
.tree dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; }
.tree dt { color: var(--muted); } .tree dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.tree table { border-collapse: collapse; font-size: 12px; }
.tree th { text-align: left; color: var(--muted); font-weight: 500; padding: 2px 10px 2px 0; }
.tree td { padding: 2px 10px 2px 0; border-top: 1px solid var(--hair); vertical-align: top; }
.tree .chips { display: flex; flex-wrap: wrap; gap: 4px; }
.tree .chips span { background: var(--hair); border-radius: 6px; padding: 0 6px; font-variant-numeric: tabular-nums; }
.navsep { height: 1px; background: var(--hair); margin: 8px; }
#gallery h2 { font-size: 26px; margin: 0 0 4px; letter-spacing: -.02em; }
#gallery .lead { color: var(--ink2); margin: 0 0 22px; max-width: 70ch; }
.set { margin-bottom: 30px; }
.set h3 { font-size: 16px; margin: 0; } .set .file { color: var(--muted); font-size: 12px; margin: 2px 0 8px; }
.users { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.users button { border: 1px solid var(--hair); background: var(--surface); color: var(--ink2); font: inherit;
  font-size: 12px; padding: 3px 10px; border-radius: 999px; cursor: pointer; }
.users button[aria-pressed="true"] { border-color: var(--accent); color: var(--ink); box-shadow: 0 0 0 1px var(--accent); }
.pics { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.pic { background: var(--surface); border: 1px solid var(--hair); border-radius: 12px; padding: 10px; min-width: 0; }
.pic.unused { opacity: .5; }
.pic canvas, .pic svg { display: block; width: 100%; height: auto; aspect-ratio: 1; border-radius: 8px;
  image-rendering: pixelated; background: #efe2c6; }
.pic svg { background: #3b3e4c; }
.pic .name { font-weight: 600; margin-top: 8px; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pic .use { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.5; overflow-wrap: anywhere; }
.pic .use a { display: inline-block; }
.pic .use a { color: var(--accent); text-decoration: none; cursor: pointer; margin-right: 5px; }
.pic .use a:hover { text-decoration: underline; }
.conv { display: grid; grid-template-columns: 280px 1fr; gap: 16px; align-items: start; }
.conv .ctl { display: grid; gap: 14px; }
.conv label, .conv .lab { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 5px; }
.conv label output { float: right; font-variant-numeric: tabular-nums; text-transform: none; letter-spacing: 0; }
.conv input[type=range] { width: 100%; margin: 0; accent-color: var(--accent); }
.conv input[type=text], .conv textarea { width: 100%; font: 12px/1.35 ui-monospace, Menlo, monospace; color: var(--ink);
  background: var(--page); border: 1px solid var(--hair); border-radius: 8px; padding: 6px 8px; }
.conv textarea { height: 300px; resize: vertical; white-space: pre; }
.conv .seg { display: flex; flex-wrap: wrap; } .conv .seg button { flex: 1; padding: 5px 8px; white-space: nowrap; }
.conv .hint { font-size: 12px; color: var(--muted); margin-top: 5px; }
.drop { border: 1.5px dashed var(--axis); border-radius: 12px; padding: 18px 12px; text-align: center; color: var(--ink2);
  cursor: pointer; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop b { display: block; color: var(--ink); }
.conv .panel canvas { display: block; width: 100%; height: auto; max-height: 62vh; object-fit: contain; border-radius: 8px;
  image-rendering: pixelated; background: #efe2c6; }
#convres canvas { aspect-ratio: 1; cursor: crosshair; touch-action: none; }
.swatches { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
.swatches button { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--axis); padding: 0; cursor: pointer;
  font-size: 10px; color: var(--muted); background: var(--surface); }
.swatches button[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { border: 1px solid var(--hair); background: var(--surface); color: var(--ink); font: inherit; padding: 5px 12px;
  border-radius: 8px; cursor: pointer; }
.conv .panel canvas.small { width: 96px; margin-top: 10px; }
@media (max-width: 900px) { .conv { grid-template-columns: 1fr; } }
#themed h2 { font-size: 26px; margin: 0 0 4px; letter-spacing: -.02em; }
#themed .lead { color: var(--ink2); margin: 0 0 22px; max-width: 76ch; }
.tday { margin-bottom: 22px; }
.tday h3 { font-size: 18px; margin: 0; text-transform: none; letter-spacing: 0; color: var(--ink); font-weight: 600; }
.tday .when { color: var(--muted); font-size: 12px; margin: 2px 0 8px; font-variant-numeric: tabular-nums; }
.tday .scene { color: var(--ink2); margin: 0 0 12px; max-width: 80ch; }
.levels { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.levels .pic.bank { border-style: dashed; }
.levels .pic .hole { aspect-ratio: 1; border-radius: 8px; display: grid; place-items: center; color: var(--muted);
  font-size: 12px; border: 1px dashed var(--axis); text-align: center; padding: 8px; }
.drafts { display: grid; gap: 10px; margin-top: 10px; }
.draft { display: grid; grid-template-columns: 140px 1fr; gap: 12px; align-items: start; border-top: 1px solid var(--hair); padding-top: 10px; }
.draft img { width: 140px; height: 140px; object-fit: cover; border-radius: 8px; background: #fff; display: block; }
.draft .what { font-weight: 600; font-size: 13px; }
.draft .tries { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 6px; }
.draft .try { display: grid; grid-template-columns: 84px 1fr; gap: 10px; max-width: 420px; font-size: 12px; color: var(--ink2); }
.draft .try canvas { width: 84px; height: 84px; border-radius: 6px; image-rendering: pixelated; background: #efe2c6; }
.draft .try b { color: var(--ink); }
@media (max-width: 900px) { .levels { grid-template-columns: repeat(2, 1fr); } .draft { grid-template-columns: 1fr; } }
.empty { color: var(--muted); padding: 30px 0; text-align: center; }
details { margin-top: 16px; color: var(--ink2); }
details pre { font-size: 11px; overflow: auto; max-height: 300px; background: var(--surface);
  border: 1px solid var(--hair); border-radius: 10px; padding: 10px; }
footer { color: var(--muted); font-size: 12px; margin-top: 22px; }
kbd { border: 1px solid var(--axis); border-radius: 4px; padding: 0 4px; font: inherit; font-size: 11px; }
@media (max-width: 900px) { body { grid-template-columns: 1fr; } nav { height: auto; position: static;
  border-right: 0; border-bottom: 1px solid var(--hair); } .pair { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<nav><h1>Daily days</h1><div class="sub" id="range"></div><button id="gallerybtn"><span class="dot"></span>Picture gallery</button><button id="convertbtn"><span class="dot"></span>Picture maker</button><button id="themedbtn"><span class="dot"></span>Themed days</button><div class="navsep"></div><div id="boards"></div></nav>
<main>
 <div id="gallery" hidden></div>
 <div id="convert" hidden></div>
 <div id="themed" hidden></div>
 <div id="boardview">
  <header>
    <h2 id="title"></h2>
    <div class="seg" id="levels"></div>
    <div class="day"><button id="prev" aria-label="Previous day">‹</button><b id="date"></b><button id="next" aria-label="Next day">›</button></div>
  </header>
  <div class="flags" id="flags"></div>
  <div class="pair">
    <section class="panel"><h3>Puzzle</h3><div id="puzzle"></div></section>
    <section class="panel"><h3>Solution</h3><div id="solution"></div></section>
  </div>
  <div class="tiles" id="tiles"></div>
  <div id="still"></div>
  <section class="panel strip"><h3><b id="stripname"></b><span id="stripnote"></span></h3><div id="strip"></div></section>
  <details><summary>The day document</summary><pre id="raw"></pre></details>
 </div>
  <footer><kbd>←</kbd> <kbd>→</kbd> day · <kbd>↑</kbd> <kbd>↓</kbd> board · <kbd>1</kbd>–<kbd>4</kbd> level · <span id="foot"></span></footer>
</main>
<div id="tip"></div>
<script id="data" type="application/json">/*DATA*/</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("data").textContent);
const INDEX = DATA.index, DAYS = DATA.days;
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, text) => {
  const svg = ["svg", "g", "rect", "line", "text", "circle", "path"].includes(tag);
  const n = svg ? document.createElementNS(NS, tag) : document.createElement(tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text !== undefined) n.textContent = text;
  return n;
};
const LEVEL_NAMES = ["Easy", "Medium", "Hard", "Insane"];
const fmtDate = k => {
  const d = new Date(Date.UTC(Math.floor(k / 10000), Math.floor(k / 100) % 100 - 1, k % 100));
  return d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
};
const fmtNum = v => typeof v === "number" ? (Number.isInteger(v) ? String(v) : v.toFixed(Math.abs(v) < 10 ? 2 : 1)) : String(v);

// --- what is wrong with a day -------------------------------------------
// error, budget_hit, a figure over two and a half deviations from the board-and-level
// mean, and a payload another day in the range also has.
const series = {};   // board|level -> docs by date
const stats = {};    // board|level -> {metric: {mean, sd, n}}
for (const b of INDEX.boards) for (const d of DAYS[b.id] || []) (series[b.id + "|" + d.level] ||= []).push(d);
const figures = d => ({ ...(d.metrics || {}), gen_ms: d.gen_ms });
for (const key in series) {
  const docs = series[key].sort((a, b) => a.date - b.date), st = stats[key] = {};
  const names = new Set(docs.flatMap(d => Object.keys(figures(d))));
  for (const m of names) {
    const xs = docs.map(d => figures(d)[m]).filter(v => typeof v === "number");
    if (xs.length < 2) continue;
    const mean = xs.reduce((a, b) => a + b, 0) / xs.length;
    const sd = Math.sqrt(xs.reduce((a, b) => a + (b - mean) ** 2, 0) / xs.length);
    st[m] = { mean, sd, n: xs.length, min: Math.min(...xs), max: Math.max(...xs) };
  }
  const seen = new Map();
  for (const d of docs) {
    d.flags = [];
    if (d.error) d.flags.push({ level: "critical", text: "error: " + d.error });
    if (d.budget_hit) d.flags.push({ level: "serious", text: "generator ran out of budget" });
    if (d.payload) {
      const sig = JSON.stringify([d.payload, d.solution]);
      if (seen.has(sig)) d.flags.push({ level: "serious", text: "same puzzle as " + fmtDate(seen.get(sig)) });
      else seen.set(sig, d.date);
    }
    for (const m in st) {
      const v = figures(d)[m], s = st[m];
      if (m === "gen_ms" || typeof v !== "number" || s.n < 8 || s.sd === 0) continue;
      const z = (v - s.mean) / s.sd;
      if (Math.abs(z) > 2.5) d.flags.push({ level: "warning", metric: m,
        text: `${m} ${fmtNum(v)} is ${z > 0 ? "high" : "low"} (mean ${fmtNum(s.mean)})` });
    }
  }
}
const worst = flags => ["critical", "serious", "warning"].find(l => flags.some(f => f.level === l)) || "";

// --- state ---------------------------------------------------------------
const state = { board: INDEX.boards[0]?.id, level: 0, date: INDEX.dates[0], metric: null, view: "board", lens: {} };
try { Object.assign(state, JSON.parse(localStorage.getItem("daily-days") || "{}")); } catch (e) {}
// #board=sudoku&level=2&date=20261013 opens that day.
for (const [k, v] of new URLSearchParams(location.hash.slice(1))) state[k] = k === "board" || k === "view" ? v : +v;
if (!DAYS[state.board]) state.board = INDEX.boards[0]?.id;
if (!INDEX.dates.includes(state.date)) state.date = INDEX.dates[0];
const docsNow = () => series[state.board + "|" + state.level] || [];
const docNow = () => docsNow().find(d => d.date === state.date);
const levelsOf = id => [...new Set((DAYS[id] || []).map(d => d.level))].sort();

// --- the grid renderer -----------------------------------------------------
const colour = c => `var(--s${((c % 12) + 12) % 12})`;
function grid(view, side) {
  const w = view.w, h = view.h, cells = view[side] || [];
  const rc = side === "puzzle" || !view.solution_row_clues ? view.row_clues : view.solution_row_clues;
  const cc = view.col_clues;
  const S = 40;
  const left = rc ? Math.max(...rc.map(r => r.length), 1) * 15 + 8 : 0;
  const top = cc ? Math.max(...cc.map(c => c.length), 1) * 15 + 8 : 0;
  const svg = el("svg", { viewBox: `${-left - 2} ${-top - 2} ${w * S + left + 4} ${h * S + top + 4}`, role: "img",
    "aria-label": `${side}, ${w} by ${h}` });
  svg.style.maxWidth = Math.min(560, (w * S + left) * 1.5) + "px";
  svg.style.margin = "0 auto";
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const c = cells[y * w + x] || {};
    const r = el("rect", { x: x * S, y: y * S, width: S, height: S, fill: c.wall ? "var(--wall)" : "var(--cell)",
      stroke: "var(--hair)", "stroke-width": 1 });
    svg.append(r);
    if (c.c !== undefined && c.c !== null && c.c >= 0 && !c.wall) {
      svg.append(el("rect", { x: x * S + 4, y: y * S + 4, width: S - 8, height: S - 8, rx: 7,
        fill: colour(c.c), opacity: c.given === false ? .5 : 1 }));
    }
  }
  const edges = (side === "solution" ? view.solution_edges : view.edges) || [];
  for (const e of edges) {
    const n = e[4] || 1, a = [e[0] * S + S / 2, e[1] * S + S / 2], b = [e[2] * S + S / 2, e[3] * S + S / 2];
    const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1, ox = -dy / len, oy = dx / len;
    for (let i = 0; i < Math.min(n, 3); i++) {
      const off = (i - (Math.min(n, 3) - 1) / 2) * 6;
      svg.append(el("line", { x1: a[0] + ox * off, y1: a[1] + oy * off, x2: b[0] + ox * off, y2: b[1] + oy * off,
        stroke: "var(--accent)", "stroke-width": 3, "stroke-linecap": "round", opacity: .85 }));
    }
  }
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const c = cells[y * w + x] || {};
    if (c.t !== undefined && c.t !== "") {
      const t = String(c.t), filled = c.c !== undefined && c.c >= 0 || c.wall;
      svg.append(el("text", { x: x * S + S / 2, y: y * S + S / 2 + 1, "text-anchor": "middle",
        "dominant-baseline": "middle", "font-size": t.length > 2 ? 12 : t.length > 1 ? 16 : 20,
        "font-weight": c.given ? 700 : 400,
        fill: c.wall ? "var(--page)" : filled ? "#fff" : c.given ? "var(--ink)" : "var(--accent)",
        style: filled && !c.wall ? "paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:2.5px" : "" }, t));
    }
    if (c.note !== undefined) svg.append(el("text", { x: x * S + 4, y: y * S + 11, "font-size": 9,
      fill: "var(--muted)" }, String(c.note)));
  }
  const reg = view.regions;
  if (reg) for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const id = reg[y * w + x];
    if (x + 1 < w && reg[y * w + x + 1] !== id) svg.append(el("line", { x1: (x + 1) * S, y1: y * S, x2: (x + 1) * S,

    const box = el("section", { class: "panel tday" });
    if (!d.theme) { box.append(el("h3", {}, "No theme"), el("div", { class: "when" }, fmtDate(d.day) + " · the day is the bank's")); host.append(box); continue; }
    box.append(el("h3", { class: "round" }, d.theme.name.en), el("div", { class: "when" },
      `${fmtDate(d.day)} · ${d.theme.name.pt} · ${d.theme.name.es} · US$${(d.cost || 0).toFixed(2)} · ${d.seconds} s · ${d.drafts.length} drawings`),
      el("p", { class: "scene" }, d.theme.scene));
    const levels = el("div", { class: "levels" });
    for (const n of Beads.SIZES) {
      const pic = d.pictures?.sizes?.[n], card = el("div", { class: "pic" + (pic ? "" : " bank") });
      card.append(pic ? thumb({ kind: "pixels" }, pic) : el("div", { class: "hole" }, "the bank's"),
        el("div", { class: "name" }, pic ? pic.id.replace(/_/g, " ") : "–"), el("div", { class: "use" }, `${n} × ${n} · ${SIZE_FOR[n]}`));
      levels.append(card);
    }
    const more = el("details"), list = el("div", { class: "drafts" });
    more.append(el("summary", {}, "The drawings and what was said of them"), list);
    for (const dr of d.drafts) {
      const row = el("div", { class: "draft" }), side = el("div");
      row.append(dr.file ? el("img", { src: "days/themed/" + dr.file, loading: "lazy", alt: dr.what }) : el("div", { class: "hole" }, "no drawing"), side);
      side.append(el("div", { class: "what" }, `${dr.what.replace(/_/g, " ")} · drawing ${dr.draft + 1}`));
      if (dr.error) side.append(el("div", { class: "use" }, dr.error));
      const tries = el("div", { class: "tries" });
      for (const t of dr.tried) {
        const tr = el("div", { class: "try" }), say = el("div");
        const failed = t.checks.filter(c => !c.ok).map(c => c.text);
        say.append(el("b", {}, `${t.size} × ${t.size}: ${t.kept ? "kept" : "turned down"}`), el("br"),
          failed.length ? "rules: " + failed.join("; ") : t.look ? `seen as: ${t.look.said}${t.look.wrong ? " · wrong: " + t.look.wrong : ""}` : "");
        tr.append(thumb({ kind: "pixels" }, { id: dr.what, rows: t.rows }), say); tries.append(tr);
      }
      side.append(tries); list.append(row);
    }
    box.append(levels, more); host.append(box);
  }
}

// --- the page ---------------------------------------------------------------
function draw() {
  try { localStorage.setItem("daily-days", JSON.stringify(state)); } catch (e) {}
  const showing = ["gallery", "convert", "themed"].includes(state.view);
  $("themed").hidden = state.view !== "themed"; $("themedbtn").setAttribute("aria-current", state.view === "themed");
  if (state.view === "themed") themedView();
  $("gallery").hidden = state.view !== "gallery"; $("convert").hidden = state.view !== "convert"; $("boardview").hidden = showing;
  $("gallerybtn").setAttribute("aria-current", state.view === "gallery");
  $("convertbtn").setAttribute("aria-current", state.view === "convert");
  if (state.view === "gallery") gallery();
  if (state.view === "convert" && !$("convert").firstChild) convertView();
  const board = INDEX.boards.find(b => b.id === state.board), levels = levelsOf(state.board);
  if (!levels.includes(state.level)) state.level = levels[0] ?? 0;
  const doc = docNow();
  $("title").textContent = board ? board.title : "";
  const nav = $("boards"); nav.textContent = "";
  for (const b of INDEX.boards) {
    const all = (DAYS[b.id] || []), flagged = all.filter(d => d.flags.length);
    const btn = el("button", { "aria-current": !showing && b.id === state.board });
    btn.append(el("span", { class: "dot " + worst(flagged.flatMap(d => d.flags)) }), b.title);
    if (flagged.length) btn.append(el("span", { class: "n", title: "flagged days" }, flagged.length));
    btn.addEventListener("click", () => { state.board = b.id; state.metric = null; state.view = "board"; draw(); });
    nav.append(btn);
  }
  const seg = $("levels"); seg.textContent = "";
  for (const l of levels) {
    const name = board?.levels?.find(x => x.difficulty === l)?.name || LEVEL_NAMES[l] || "Level " + l;
    const b = el("button", { "aria-pressed": l === state.level }, name);
    b.addEventListener("click", () => { state.level = l; draw(); });
    seg.append(b);
  }
  const i = INDEX.dates.indexOf(state.date);
  $("date").textContent = fmtDate(state.date);
  $("prev").disabled = i <= 0; $("next").disabled = i >= INDEX.dates.length - 1;
  const fl = $("flags"); fl.textContent = "";
  for (const f of doc?.flags || []) { const s = el("span", { class: "flag" }); s.append(el("span", { class: "dot " + f.level }), f.text); fl.append(s); }
  $("puzzle").replaceChildren(side(doc, "puzzle"));
  $("solution").replaceChildren(side(doc, "solution"));
  const tiles = $("tiles"); tiles.textContent = "";
  const st = stats[state.board + "|" + state.level] || {}, fig = doc ? figures(doc) : {};
  const numeric = Object.keys(fig).filter(k => typeof fig[k] === "number" && st[k]);
  if (!numeric.includes(state.metric)) state.metric = numeric.find(k => k !== "gen_ms" && st[k].sd > 0) || numeric[0] || null;
  if (doc) {
    const src = el("div", { class: "tile plain" });
    src.append(el("div", { class: "k" }, "source"), el("div", { class: "v" }, doc.source || "–"), el("div", { class: "m" }, "seed " + doc.seed));
    tiles.append(src);
  }
  // The figures that move over the range first; the ones that never do are
  // one quiet line under them.
  const still = Object.keys(fig).filter(k => k !== "gen_ms" && (st[k] ? st[k].sd === 0 : docsNow().every(d => figures(d)[k] === fig[k])));
  $("still").textContent = still.length ? "Same every day: " + still.map(k => `${k.replace(/_/g, " ")} ${fmtNum(fig[k])}`).join(" · ") : "";
  for (const k in fig) {
    if (still.includes(k)) continue;
    const num = numeric.includes(k);
    const t = el(num ? "button" : "div", { class: "tile" + (num ? "" : " plain") });
    if (num) { t.setAttribute("aria-pressed", k === state.metric); t.addEventListener("click", () => { state.metric = k; draw(); }); }
    t.append(el("div", { class: "k", title: k }, k.replace(/_/g, " ")), el("div", { class: "v" }, fmtNum(fig[k])),
      el("div", { class: "m" }, num ? `mean ${fmtNum(st[k].mean)}` : " "));
    tiles.append(t);
  }
  strip();
  $("raw").textContent = doc ? JSON.stringify({ ...doc, flags: undefined }, null, 1) : "";
}
$("gallerybtn").addEventListener("click", () => { state.view = "gallery"; draw(); scrollTo(0, 0); });
$("convertbtn").addEventListener("click", () => { state.view = "convert"; draw(); scrollTo(0, 0); });
$("themedbtn").addEventListener("click", () => { state.view = "themed"; draw(); scrollTo(0, 0); });
$("prev").addEventListener("click", () => step(-1));
$("next").addEventListener("click", () => step(1));
function step(n) { const i = INDEX.dates.indexOf(state.date) + n; if (i >= 0 && i < INDEX.dates.length) { state.date = INDEX.dates[i]; draw(); } }
addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || state.view !== "board") return;
  const ids = INDEX.boards.map(b => b.id), at = ids.indexOf(state.board);
  if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "ArrowRight") step(1);
  else if (e.key === "ArrowUp" && at > 0) { state.board = ids[at - 1]; state.metric = null; draw(); }
  else if (e.key === "ArrowDown" && at < ids.length - 1) { state.board = ids[at + 1]; state.metric = null; draw(); }
  else if (/^[1-4]$/.test(e.key) && levelsOf(state.board).includes(+e.key - 1)) { state.level = +e.key - 1; draw(); }
  else return;
  e.preventDefault();
});
$("range").textContent = INDEX.dates.length ? `${INDEX.dates.length} days from ${fmtDate(INDEX.dates[0])}` : "nothing exported";
$("foot").textContent = `exported ${INDEX.exported || "?"} UTC at ${INDEX.commit || "?"}, dealt on this Mac · days are UTC`;
draw();
addEventListener("resize", strip);
</script>
</body>
