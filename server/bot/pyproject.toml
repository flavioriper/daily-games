[project]
name = "persona-studio"
version = "0.1.0"
description = "One sentence becomes a voice persona: Deepgram Flux, Jev plus a small policy, any LLM, ElevenLabs"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pipecat-ai[typesafe,anthropic,openai,google,groq,cerebras,deepgram,elevenlabs,silero,websocket]==1.15.0",
  "torch>=2.4",
  "fastapi",
  "uvicorn[standard]",
  "httpx",
  "anthropic",
  "numpy",
  "pydantic>=2",
  "pyyaml",
  "fastembed>=0.9.1",
  "google-auth",
  "requests",
  "websockets",
]
[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
[tool.uv]
package = false
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
